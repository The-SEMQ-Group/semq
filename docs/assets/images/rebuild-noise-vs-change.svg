<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" role="img" aria-labelledby="t d">
  <title id="t">Rebuild noise against a real change</title>
  <desc id="d">Illustrative example: an unchanged document has different floating-point values but the same symbols. An edited document has different symbols and its row is reported. The gate compares changes with the measured floor; changed symbols alone do not determine its verdict.</desc>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9aa5ad"/>
    </marker>
    <style>
      .h { font: 600 10px Geist, system-ui, sans-serif; fill: #59636d; letter-spacing: .08em; }
      .t { font: 13px Geist, system-ui, sans-serif; fill: #171717; }
      .s { font: 11px Geist, system-ui, sans-serif; fill: #59636d; }
      .m { font: 13px "Geist Mono", ui-monospace, monospace; fill: #171717; }
      .d { fill: #a34d3b; font-weight: 600; }
      .ok { font: 600 12px Geist, system-ui, sans-serif; fill: #276b59; }
      .no { font: 600 12px Geist, system-ui, sans-serif; fill: #a34d3b; }
      .ln { stroke: #9aa5ad; stroke-width: 1.2; fill: none; }
      .b0 { fill: #dbe8f0; } .b1 { fill: #9cc1d8; } .b2 { fill: #4f8db5; } .b3 { fill: #236f9c; }
      .x { fill: none; stroke: #a34d3b; stroke-width: 2; }
      .sep { stroke: #e5e7eb; stroke-width: 1; }
    </style>
  </defs>

  <text class="h" x="20" y="22">TEXT</text>
  <text class="h" x="232" y="22">ONE COORDINATE OF ITS EMBEDDING</text>
  <text class="h" x="470" y="22">SEMQ SYMBOLS</text>
  <text class="h" x="632" y="22">GATE</text>
  <line class="sep" x1="20" x2="740" y1="34" y2="34"/>

  <!-- Reference -->
  <text class="t" x="20" y="70">“Aspirin reduces risk…”</text>
  <text class="s" x="20" y="88">reference, built on a CPU</text>
  <line class="ln" x1="196" x2="224" y1="70" y2="70" marker-end="url(#a)"/>
  <text class="m" x="232" y="74">0.06120004</text>
  <line class="ln" x1="434" x2="462" y1="70" y2="70" marker-end="url(#a)"/>
  <g transform="translate(470,58)">
    <rect class="b2" x="0" width="18" height="24" rx="2"/><rect class="b1" x="21" width="18" height="24" rx="2"/>
    <rect class="b3" x="42" width="18" height="24" rx="2"/><rect class="b0" x="63" width="18" height="24" rx="2"/>
    <rect class="b1" x="84" width="18" height="24" rx="2"/><rect class="b2" x="105" width="18" height="24" rx="2"/>
    <rect class="b0" x="126" width="18" height="24" rx="2"/>
  </g>
  <text class="s" x="632" y="74">reference state</text>
  <line class="sep" x1="20" x2="740" y1="106" y2="106"/>

  <!-- Same text, other device -->
  <text class="t" x="20" y="142">“Aspirin reduces risk…”</text>
  <text class="s" x="20" y="160">same text, rebuilt on a GPU</text>
  <line class="ln" x1="196" x2="224" y1="142" y2="142" marker-end="url(#a)"/>
  <text class="m" x="232" y="146">0.061<tspan class="d">19998</tspan></text>
  <text class="s" x="232" y="164">last digits differ: a hash changes</text>
  <line class="ln" x1="434" x2="462" y1="142" y2="142" marker-end="url(#a)"/>
  <g transform="translate(470,130)">
    <rect class="b2" x="0" width="18" height="24" rx="2"/><rect class="b1" x="21" width="18" height="24" rx="2"/>
    <rect class="b3" x="42" width="18" height="24" rx="2"/><rect class="b0" x="63" width="18" height="24" rx="2"/>
    <rect class="b1" x="84" width="18" height="24" rx="2"/><rect class="b2" x="105" width="18" height="24" rx="2"/>
    <rect class="b0" x="126" width="18" height="24" rx="2"/>
  </g>
  <text class="ok" x="632" y="140">✓ same state</text>
  <text class="s" x="632" y="158">pass, no alarm</text>
  <line class="sep" x1="20" x2="740" y1="178" y2="178"/>

  <!-- Edited document -->
  <text class="t" x="20" y="214">“Aspirin increases risk…”</text>
  <text class="s" x="20" y="232">edited document</text>
  <line class="ln" x1="196" x2="224" y1="214" y2="214" marker-end="url(#a)"/>
  <text class="m" x="232" y="218"><tspan class="d">0.06401000</tspan></text>
  <text class="s" x="232" y="236">a real change</text>
  <line class="ln" x1="434" x2="462" y1="214" y2="214" marker-end="url(#a)"/>
  <g transform="translate(470,202)">
    <rect class="b2" x="0" width="18" height="24" rx="2"/><rect class="b1" x="21" width="18" height="24" rx="2"/>
    <rect class="b1" x="42" width="18" height="24" rx="2"/><rect class="x" x="42" width="18" height="24" rx="2"/>
    <rect class="b0" x="63" width="18" height="24" rx="2"/>
    <rect class="b1" x="84" width="18" height="24" rx="2"/><rect class="b3" x="105" width="18" height="24" rx="2"/>
    <rect class="x" x="105" width="18" height="24" rx="2"/><rect class="b0" x="126" width="18" height="24" rx="2"/>
  </g>
  <text class="no" x="632" y="212">changed row</text>
  <text class="s" x="632" y="230">compare with floor</text>
</svg>
