[package]
name = "semq"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Safe Rust bindings to the SEMQ core: deterministic symbolic encoding of float32 vectors."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/The-SEMQ-Group/semq"
documentation = "https://docs.rs/semq"
readme = "README.md"
keywords = ["embeddings", "quantization", "vectors", "determinism", "reproducibility"]
categories = ["encoding", "algorithms", "science"]
include = ["Cargo.toml", "src/**", "README.md", "LICENSE.md", "NOTICE"]

# docs.rs builds the documentation for one target only: other targets would
# cross-compile the C core, which its builders cannot do.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
semq-sys = { path = "../semq-sys", version = "=1.0.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
