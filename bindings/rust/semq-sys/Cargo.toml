[package]
name = "semq-sys"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Raw FFI bindings to the SEMQ native library."
license = "PolyForm-Noncommercial-1.0.0"
links = "semq"
repository = "https://github.com/The-SEMQ-Group/semq"
documentation = "https://docs.rs/semq-sys"
keywords = ["embeddings", "quantization", "ffi"]
categories = ["external-ffi-bindings"]
include = ["Cargo.toml", "build.rs", "src/**", "native/**", "LICENSE.md", "NOTICE"]

# docs.rs builds the documentation for one target only: other targets would
# cross-compile the C core, which its builders cannot do.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
cmake = "0.1"
