# Check the publishing credentials of every registry without publishing.
#
# Each job runs in the environment the release publishes from and does the
# release's authentication step, then stops:
#   PyPI       mints an upload token through the trusted publisher (OIDC)
#   crates.io  exchanges the OIDC token through the trusted publisher
#   npm        reads the account behind NPM_PUBLISH_TOKEN
# Nothing is uploaded, and the minted tokens are not used.
#
# The publish environments accept only v* tags, so allow main on them for
# the run, then remove it; see docs/RELEASING.md.

name: registry-credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: pypi-release
    permissions:
      id-token: write
    steps:
      - name: Mint an upload token through the trusted publisher
        run: |
          audience="$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)"
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)"
          echo "::add-mask::$oidc"
          response="$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' -d "{\"token\": \"$oidc\"}")"
          token="$(jq -r '.token // empty' <<< "$response")"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "PyPI accepted the trusted publisher; an upload token was minted and discarded."
          else
            echo "PyPI refused the trusted publisher:"
            jq '{message, errors}' <<< "$response"
            exit 1
          fi

  crates:
    name: crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: crates-release
    permissions:
      contents: read
      id-token: write
    steps:
      # The release's own step. It fails unless a trusted publisher on
      # crates.io matches this repository, workflow and environment; its
      # post step revokes the token.
      - name: Authenticate with crates.io using OIDC
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  npm:
    name: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm-release
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Read the account behind the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: echo "npm accepts the token for $(npm whoami)"
