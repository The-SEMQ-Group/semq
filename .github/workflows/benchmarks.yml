name: benchmark-contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels the run for its previous commit. Runs
# on main and on tags are never cancelled.
concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # CI never runs the data preparation, which needs model runtimes. Resolving
  # its pinned environment on the documented minimum Python still catches
  # pins that conflict or that no longer install there.
  data-environment:
    name: data environment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve the data preparation environment
        run: |
          python -m pip install --dry-run --quiet -r benchmarks/requirements-data.txt

  quality-contracts:
    name: quality contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install SDK and benchmark test dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements/benchmarks.txt
          python -m pip install -e . -r benchmarks/requirements-faiss.txt -r benchmarks/requirements-evaluation.txt
      - name: Build an identifiable native library
        run: |
          cmake -S . -B build-benchmarks -DCMAKE_BUILD_TYPE=Release \
            -DSEMQ_BUILD_TESTS=OFF -DSEMQ_BUILD_BENCHMARKS=OFF -DSEMQ_ENABLE_SANITIZERS=OFF
          cmake --build build-benchmarks --parallel 2
      - name: Validate metric and adapter contracts
        env:
          SEMQ_LIBRARY_PATH: ${{ github.workspace }}/build-benchmarks/libsemq.so
        run: |
          python -m black --target-version py311 --check benchmarks
          python -m mypy benchmarks
          python -m pytest benchmarks/tests -q
          python -m benchmarks.publish --check
          python -m benchmarks.size --check
          python -m benchmarks.reproducibility --check
          python -m benchmarks.page --check
      - name: Measure quant kernels and complete rebuild gate on this x86 host
        env:
          SEMQ_LIBRARY_PATH: ${{ github.workspace }}/build-benchmarks/libsemq.so
        run: |
          mkdir -p benchmarks/results/ci-performance
          lscpu | tee benchmarks/results/ci-performance/cpu.txt
          python -m benchmarks.speed measure --rows 100000 --dims 768 --runs 5 \
            --output benchmarks/results/ci-performance/speed.json
          python -m benchmarks.scale --rows 1000000 \
            --output benchmarks/results/ci-performance/scale.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path('benchmarks/results/ci-performance')
          speed = json.loads((root / 'speed.json').read_text())['results']
          quant = speed['semq']['768']['semq_quant4']
          print('### quant, 100,000 rows × 768 dimensions')
          print(f'- Selected backend: {quant["default_backend"]}')
          for backend, row in quant['backends'].items():
              rate = row['encode']['vectors_per_second']
              print(f'- {backend}: {rate:,.0f} vectors/s, digest {row["content_digest"]}')
          for backend in ('avx2', 'avx512'):
              if backend not in quant['backends']:
                  print(f'- {backend}: unavailable on this runner; no performance claim')
          scale = json.loads((root / 'scale.json').read_text())['results']
          gate = scale['rows']['1000000']['operations']['gate']
          print('### Full gate, 1,000,000 rows × 768 dimensions')
          print(f'- {gate["seconds"]:.3f} s, {gate["peak_rss_bytes"] / 1e9:.2f} GB peak RSS, '
                f'within floor: {gate["within_floor"]}')
          PY
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quant-and-gate-performance-${{ github.sha }}
          path: benchmarks/results/ci-performance/
          overwrite: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Evaluate quality and cost scenarios
        if: github.event_name == 'push'
        env:
          SEMQ_LIBRARY_PATH: ${{ github.workspace }}/build-benchmarks/libsemq.so
        run: |
          python -m benchmarks.run \
            --config benchmarks/configs/quality-faiss-smoke.json \
            --output benchmarks/results/ci-smoke
          python -m benchmarks.costs \
            --scenario benchmarks/configs/cost-illustrative.json \
            --output benchmarks/results/ci-costs
          python -m benchmarks.costs \
            --scenario benchmarks/configs/cost-storage-illustrative.json \
            --report benchmarks/results/ci-smoke/report.json --method quant2 \
            --output benchmarks/results/ci-storage-costs
          python -m benchmarks.render benchmarks/results/ci-smoke/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Locate previous successful main report
        if: github.event_name == 'push'
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'benchmarks.yml', branch: 'main',
              event: 'push', status: 'success', per_page: 20
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id >= context.runId) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id
              });
              const name = `benchmark-reports-${run.head_sha}`;
              if (artifacts.data.artifacts.some(a => a.name === name && !a.expired)) {
                core.setOutput('run-id', String(run.id));
                core.setOutput('artifact-name', name);
                return;
              }
            }
            core.notice('No retained successful main baseline; this run will establish one.');
      - name: Download baseline
        if: github.event_name == 'push' && steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.baseline.outputs.artifact-name }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/benchmark-baseline
      - name: Compare compatible quality reports
        if: github.event_name == 'push'
        env:
          BASELINE_REPORT: ${{ runner.temp }}/benchmark-baseline/ci-smoke/report.json
        run: |
          baseline_args=()
          if [ -f "$BASELINE_REPORT" ]; then
            baseline_args=(--baseline "$BASELINE_REPORT")
          fi
          python -m benchmarks.compare \
            --current benchmarks/results/ci-smoke/report.json \
            "${baseline_args[@]}" \
            --output benchmarks/results/ci-smoke/comparison.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark reports
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-reports-${{ github.sha }}
          path: |
            benchmarks/results/**/report.json
            benchmarks/results/**/comparison.json
          if-no-files-found: ignore
          retention-days: 30
