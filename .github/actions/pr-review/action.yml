name: SEMQ PR review
description: >
  Review a pull request diff with two models on Amazon Bedrock and post
  one merged comment. Advisory only: it cannot approve, merge, or push.

# Mechanics live here; the review criteria live in the calling repo's
# prompt file.
#
# A public repository cannot use an action stored in a private one, so this
# repository keeps its own copy. The private repositories use another copy
# of this action; port fixes between the two.

inputs:
  role-arn:
    description: IAM role to assume through GitHub OIDC. Needs bedrock:InvokeModel.
    required: true
  github-token:
    description: >
      Token used to post the comment and to read PR metadata. Pass
      secrets.GITHUB_TOKEN.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  base-sha:
    description: >
      Base commit of the pull request. Leave empty on a manual run; the
      script then reads it from the GitHub API.
    required: false
    default: ""
  head-sha:
    description: >
      Head commit of the pull request. Leave empty on a manual run; the
      script then reads it from the GitHub API.
    required: false
    default: ""
  pr-body:
    description: >
      Pull request description. Treated as untrusted input. Read from the
      GitHub API when empty.
    required: false
    default: ""
  prompt-path:
    description: Review criteria, relative to the calling repository root.
    required: false
    default: .github/pr-review-prompt.md
  tripwire-paths:
    description: >
      Newline-separated paths whose modification is itself worth flagging.
      A prefix ending in / matches everything beneath it.
    required: false
    default: ""
  diff-exclude-paths:
    description: >
      Newline-separated git pathspec globs whose diffs are withheld from
      the model (the changed-files list still names them). Empty means
      the built-in lockfile set (uv.lock, package-lock.json, and
      friends), which is token-dense noise that can overflow the model
      context.
    required: false
    default: ""
  model-ids:
    description: >
      Bedrock models, one per line. Every model reviews the same diff in
      parallel and the findings merge into one comment. The defaults are
      the strongest pair this account can invoke today. Swap them for
      us.anthropic.claude-opus-5 and us.openai.gpt-5.6-sol once AWS
      grants the account access to those models; IAM already allows both.
    required: false
    default: |
      qwen.qwen3-coder-480b-a35b-v1:0
      openai.gpt-oss-120b-1:0
  aws-region:
    description: Region to call Bedrock in.
    required: false
    default: us-east-2
  min-severity:
    description: low, medium, or high. Blocking findings always post regardless.
    required: false
    default: medium
  temperature:
    description: >
      Pins sampling so two runs of one commit agree. A model that rejects
      the field is retried without it, so this is safe to leave set
      across a model swap. Empty means the model default.
    required: false
    default: "0"
  dry-run:
    description: Set to any non-empty value to print instead of posting.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Caller must check out with fetch-depth: 0 — the script diffs
    # base...head and a shallow clone has no merge base.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Install boto3
      shell: bash
      run: pip install --quiet boto3

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        PR_BODY: ${{ inputs.pr-body }}
        PROMPT_FILE: ${{ inputs.prompt-path }}
        TRIPWIRE_PATHS: ${{ inputs.tripwire-paths }}
        DIFF_EXCLUDE_PATHS: ${{ inputs.diff-exclude-paths }}
        BEDROCK_MODEL_IDS: ${{ inputs.model-ids }}
        AWS_REGION: ${{ inputs.aws-region }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        REVIEW_TEMPERATURE: ${{ inputs.temperature }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: python "${{ github.action_path }}/pr_review.py"
